[package]
name = "logkeeper"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.1"
license = "MPL-2.0"
publish = false
repository = "https://github.com/bijectionhq/logkeeper"
description = "Epoch-fenced durable journals and a Rust quorum client"

[features]
simulation = []

[dependencies]
bytes = "1"
crc32fast = "1.5"
fs2 = "0.4"
futures = "0.3"
parking_lot = "0.12"
prost = "0.14.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
