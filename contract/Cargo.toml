[package]
name = "journal-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MPL-2.0"
publish = false
description = "The ordered, fenced stream journal contract: the whole interface a journal consumer sees"

[features]
conformance = []
serde = ["dep:serde", "bytes/serde"]

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
