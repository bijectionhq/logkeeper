apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logkeeper
  labels:
    app.kubernetes.io/name: logkeeper
spec:
  serviceName: logkeeper
  replicas: 1
  # Each keeper has its own workload and Secret. Deliver template updates
  # by evicting one keeper at a time after the quorum preflight.
  updateStrategy:
    type: OnDelete
  minReadySeconds: 30
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: logkeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logkeeper
    spec:
      hostNetwork: true
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirstWithHostNet
      # SIGTERM hands off leadership and flushes the WAL.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: logkeeper
      initContainers:
        - name: install
          image: logkeeper-consensus:dev
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              ordinal="$KEEPER_ORDINAL"
              id="$(cat "/etc/logkeeper/keepers/keeper-$ordinal.id")"
              cp "/etc/logkeeper/keepers/keeper-$ordinal.json" /run/logkeeper/keeper.json
              cp /etc/logkeeper/keepers/placement.json /var/lib/logkeeper/registry/placement.json
              cp "/etc/logkeeper/keepers/keeper-$ordinal.provision.json" \
                "/var/lib/logkeeper/registry/$id.provision.json"
              if [ -e /var/lib/logkeeper/media/data/KEEPER ]; then
                exit 0
              fi
              case ",$LOGKEEPER_INITIALIZE," in
                *",$id,"*)
                  echo "installing fresh media for keeper $id"
                  exec logkeeper keeper initialize --config /run/logkeeper/keeper.json
                  ;;
              esac
              echo "keeper $id has no installed media and is not listed in logkeeper-initialize;" \
                "a keeper ID is never reused on new media (docs/runbooks/replace-disk.md)" >&2
              exit 1
          env:
            - name: KEEPER_ORDINAL
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['logkeeper.bijectionhq.com/keeper-ordinal']" }
            - name: LOGKEEPER_INITIALIZE
              valueFrom: { configMapKeyRef: { name: logkeeper-initialize, key: keepers } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: keepers, mountPath: /etc/logkeeper/keepers, readOnly: true }
            - { name: tls, mountPath: /etc/logkeeper/tls, readOnly: true }
            - { name: config, mountPath: /run/logkeeper }
            - { name: media, mountPath: /var/lib/logkeeper/media }
            - { name: registry, mountPath: /var/lib/logkeeper/registry }
      containers:
        - name: keeper
          image: logkeeper-consensus:dev
          imagePullPolicy: IfNotPresent
          args: [--config, /run/logkeeper/keeper.json]
          ports:
            - { name: application, containerPort: 5441 }
            - { name: control, containerPort: 5541 }
            - { name: bulk, containerPort: 5641 }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 8Gi }
          startupProbe:
            exec: { command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:5742/live"] }
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec: { command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:5742/live"] }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec: { command: [curl, -fsS, -o, /dev/null, "http://127.0.0.1:5742/ready"] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls, mountPath: /etc/logkeeper/tls, readOnly: true }
            - { name: config, mountPath: /run/logkeeper, readOnly: true }
            - { name: media, mountPath: /var/lib/logkeeper/media }
            - { name: registry, mountPath: /var/lib/logkeeper/registry }
      volumes:
        - name: keepers
          configMap: { name: logkeeper-keepers }
        - name: tls
          secret: { secretName: logkeeper-tls, defaultMode: 0440 }
        - name: config
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
  volumeClaimTemplates:
    - metadata: { name: media }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: logkeeper-local
        resources: { requests: { storage: 400Gi } }
    - metadata: { name: registry }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: logkeeper-local
        resources: { requests: { storage: 1Gi } }
