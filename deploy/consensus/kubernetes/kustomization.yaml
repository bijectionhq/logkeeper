# Three consensus keepers, one per zone. Render with `kubectl kustomize`.
# Before applying: set the node IPs in keepers/*.json, the node names and
# disk paths in volumes.yaml, the certificate digests in
# keepers/*.provision.json, and create the `logkeeper-tls` Secret. See
# docs/deployment.md. The probes and preStop hook use each keeper's plain
# admin listener on 127.0.0.1:5741 (`admin` in keepers/*.json).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logkeeper
resources:
  - namespace.yaml
  - volumes.yaml
  - statefulset.yaml
  - poddisruptionbudget.yaml
configMapGenerator:
  - name: logkeeper-keepers
    files:
      - keepers/keeper-0.json
      - keepers/keeper-0.id
      - keepers/keeper-0.provision.json
      - keepers/keeper-1.json
      - keepers/keeper-1.id
      - keepers/keeper-1.provision.json
      - keepers/keeper-2.json
      - keepers/keeper-2.id
      - keepers/keeper-2.provision.json
      - keepers/placement.json
  # Keeper UUIDs allowed to install fresh media on this rollout, comma
  # separated. Set it for the first bring-up or a replacement keeper, and
  # empty it again once the keeper serves.
  - name: logkeeper-initialize
    literals:
      - keepers=
