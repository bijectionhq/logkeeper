# Six consensus keepers, two per failure domain. Render with kubectl kustomize.
# This fixture uses example hosts and certificate digests. See docs/deployment.md
# to prepare a staging inventory and scope the credential Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logkeeper
resources:
  - namespace.yaml
  - volumes.yaml
  - service.yaml
  - keeper-0
  - keeper-1
  - keeper-2
  - keeper-3
  - keeper-4
  - keeper-5
  - poddisruptionbudget.yaml
configMapGenerator:
  - name: logkeeper-keepers
    files:
      - keepers/keeper-0.json
      - keepers/keeper-0.id
      - keepers/keeper-0.provision.json
      - keepers/keeper-1.json
      - keepers/keeper-1.id
      - keepers/keeper-1.provision.json
      - keepers/keeper-2.json
      - keepers/keeper-2.id
      - keepers/keeper-2.provision.json
      - keepers/keeper-3.json
      - keepers/keeper-3.id
      - keepers/keeper-3.provision.json
      - keepers/keeper-4.json
      - keepers/keeper-4.id
      - keepers/keeper-4.provision.json
      - keepers/keeper-5.json
      - keepers/keeper-5.id
      - keepers/keeper-5.provision.json
      - keepers/placement.json
  # Keeper UUIDs allowed to install fresh media on this rollout, comma
  # separated. Set it for the first bring-up or a replacement keeper, and
  # empty it again once the keeper serves.
  - name: logkeeper-initialize
    options:
      disableNameSuffixHash: true
    literals:
      - keepers=
