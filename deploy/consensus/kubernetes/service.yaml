# Headless service that names each keeper's pod: keeper N is
# logkeeper-N-0.logkeeper.logkeeper.svc.cluster.local in every inventory, and
# a rescheduled pod is found again under its name at the next connect. The
# name never decides identity: each connection checks the keeper URI in the
# peer's certificate. Addresses are published before pods are ready, because
# a keeper turns ready only once it reaches a peer.
apiVersion: v1
kind: Service
metadata:
  name: logkeeper
  labels:
    app.kubernetes.io/name: logkeeper
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: logkeeper
  ports:
    - { name: application, port: 5441 }
    - { name: control, port: 5541 }
    - { name: bulk, port: 5641 }
