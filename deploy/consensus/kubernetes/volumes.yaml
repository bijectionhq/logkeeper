# Six keepers with dedicated media and enrollment volumes.
# Match each node, path, and capacity to the staging inventory.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logkeeper-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: logkeeper-media-0
spec:
  capacity: { storage: 400Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: logkeeper-local
  claimRef: { namespace: logkeeper, name: media-logkeeper-0-0 }
  local: { path: /mnt/logkeeper-media }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [keeper-node-0] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: logkeeper-registry-0
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: logkeeper-local
  claimRef: { namespace: logkeeper, name: registry-logkeeper-0-0 }
  local: { path: /mnt/logkeeper-registry }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [keeper-node-0] }
