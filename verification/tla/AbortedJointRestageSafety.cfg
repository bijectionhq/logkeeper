\* CE-2 safety: restaging a copy that voted under an uncommitted joint
\* configuration of an aborted move keeps every Raft safety property.
SPECIFICATION AbortedJointSpec
CONSTANT
    Nil = Nil
    Keepers = {"k1", "k2", "k3", "k4"}
    GenesisVoters = {"k1", "k2", "k3"}
    Values = {"v1"}
    MaxTerm = 3
    RecoveryGap = 10
    MaxLogLen = 7
    MaxAppends = 1
    AllowPark = FALSE
    AllowReplace = TRUE
    AllowRetire = FALSE
    AllowAbortedReplace = FALSE
    AllowStaleLearner = FALSE
    AllowWipe = FALSE
    AllowRecovery = FALSE
    MaxReturningLost = 0
    AllowSurvivorStopAfterRecovery = FALSE
    AllowSnapshot = FALSE
    AllowClientReads = FALSE
    AllowStop = TRUE
    MaxStopped = 1
    MaxCrashes = 1
INVARIANT
    ElectionSafety
    CommittedEntriesPreserved
    RetiredNeverVotes
    LogMatching
