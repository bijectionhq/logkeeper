\* Three voters, a fixed leader, three records, two crashes at any point
\* (enough for a recovery from a down survivor). Expected: every invariant holds.
SPECIFICATION Spec
CONSTANTS
    Leader = l
    Followers = {f1, f2}
    CountOverlay = FALSE
    RecoverTip = FALSE
    MaxCrashes = 2
    FlushIdleMarker = TRUE
INVARIANTS
    ChosenHasDurableQuorum
    AppliedHasLocalBytes
    MarkerHasLocalCommittedBytes
    RecoveryKeepsOnlyCommitted
