\* Control: the leader counts its in-memory overlay toward commit before its
\* own WAL write lands, so a record is chosen with one durable copy.
SPECIFICATION Spec
CONSTANTS
    Leader = l
    Followers = {f1, f2}
    CountOverlay = TRUE
    RecoverTip = FALSE
    MaxCrashes = 0
    FlushIdleMarker = TRUE
INVARIANT ChosenHasDurableQuorum
