\* As AsyncAppend with one crash, under fairness. Expected: every request is
\* answered (or a recovery ran) and every marker catches up with what is
\* learned and durable.
SPECIFICATION Spec
CONSTANTS
    Leader = l
    Followers = {f1, f2}
    CountOverlay = FALSE
    RecoverTip = FALSE
    MaxCrashes = 1
    FlushIdleMarker = TRUE
PROPERTIES
    RequestsSettle
    MarkersCatchUp
