\* Control: the recovery keeps the writer's durable tip instead of cutting at
\* its durable commit index, so a record it never knew committed survives.
SPECIFICATION Spec
CONSTANTS
    Leader = l
    Followers = {f1, f2}
    CountOverlay = FALSE
    RecoverTip = TRUE
    MaxCrashes = 2
    FlushIdleMarker = TRUE
INVARIANT RecoveryKeepsOnlyCommitted
