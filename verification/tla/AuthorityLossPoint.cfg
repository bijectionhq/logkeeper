\* The reported loss point, from a cut where the survivor led and wrote x at
\* LSN 2 that it never committed before it was cut off. Leases play no part,
\* so none is modeled. Expected: LossAboveReportedHead is violated: the other
\* two commit another record at LSN 2, and the recovery reports head 2.
SPECIFICATION LossSpec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, a, b, r1, r2}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, a, b}
    Survivors = {s}
    Replacements = {r1, r2}
    L = 2
    M = 1
    D = 1
    WaitOut = FALSE
    FenceRule = "AllOld"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 0
    MaxLogLen = 5
    MaxAppends = 3
    MaxPartitionChanges = 0
    PartitionAfterRecovery = FALSE
    AllowRecovery = TRUE
    AllowCatalogOutage = FALSE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {}
    StoppedAtStart = {}
    LostLeader = NoProc
SYMMETRY Symmetry
INVARIANT
    TypeOK
    LossAboveReportedHead
