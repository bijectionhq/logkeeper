\* The spec's wording of --lost: it narrows fencing to the named keepers.
\* With --lost partial or wrong, an unnamed lost voter that reaches the
\* catalog renews unfenced and leads the old configuration with the fenced
\* voter's vote. Expected: NoMixedHistory is violated.
SPECIFICATION Spec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, a, b, r1, r2}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, a, b}
    Survivors = {s}
    Replacements = {r1, r2}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "NamedOnly"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 1
    MaxLogLen = 5
    MaxAppends = 2
    MaxPartitionChanges = 1
    PartitionAfterRecovery = TRUE
    AllowRecovery = TRUE
    AllowCatalogOutage = FALSE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {a, b}
    StoppedAtStart = {}
    LostLeader = NoProc
SYMMETRY Symmetry
INVARIANT
    TypeOK
    NoMixedHistory
    CommittedEntriesPreserved
    ElectionSafety
    NewWorldLogMatching
