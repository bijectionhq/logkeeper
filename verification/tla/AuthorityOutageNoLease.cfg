\* Control: without leases a leader keeps leading through a catalog outage.
\* Expected: LeadershipLapses is violated.
SPECIFICATION FairSpec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, a, b}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, a, b}
    Survivors = {s, a, b}
    Replacements = {}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 2
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 0
    PartitionAfterRecovery = TRUE
    AllowRecovery = FALSE
    AllowCatalogOutage = TRUE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {}
    StoppedAtStart = {}
    LostLeader = NoProc
INVARIANT
    TypeOK
PROPERTY
    LeadershipLapses
