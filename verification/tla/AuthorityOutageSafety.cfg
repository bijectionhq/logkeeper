\* The main configuration with a permanent catalog outage at any time.
\* Expected: Safety holds.
SPECIFICATION Spec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, a, b, r1, r2}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, a, b}
    Survivors = {s}
    Replacements = {r1, r2}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 1
    MaxLogLen = 5
    MaxAppends = 2
    MaxPartitionChanges = 1
    PartitionAfterRecovery = TRUE
    AllowRecovery = TRUE
    AllowCatalogOutage = TRUE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {a, b}
    StoppedAtStart = {}
    LostLeader = NoProc
SYMMETRY Symmetry
INVARIANT
    TypeOK
    NoMixedHistory
    CommittedEntriesPreserved
    ElectionSafety
    NewWorldLogMatching
    OneRecoveryRecord
