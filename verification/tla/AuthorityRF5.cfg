\* RF 5: three lost voters, a quorum of the old configuration, keep running
\* through a recovery from two survivors; the recovered copies refuse the lost
\* voters at any term. Expected: Safety holds.
SPECIFICATION Spec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, t, a, b, c, r1, r2, r3}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, t, a, b, c}
    Survivors = {s, t}
    Replacements = {r1, r2, r3}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = TRUE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 1
    PartitionAfterRecovery = TRUE
    AllowRecovery = TRUE
    AllowCatalogOutage = FALSE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {a, b, c}
SYMMETRY Symmetry
INVARIANT
    TypeOK
    NoMixedHistory
    CommittedEntriesPreserved
    ElectionSafety
    NewWorldLogMatching
