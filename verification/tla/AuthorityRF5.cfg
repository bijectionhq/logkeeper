\* RF 5 as the code recovers (keeper/recovery.rs): survivors s and t; only
\* the more advanced survivor writes the recovery round, and t keeps running
\* with its lease. Lost voters a and b keep running and lead the old
\* configuration (c is down: a smaller cut than the 8-keeper one, so TLC
\* finishes). t refuses a and b by identity from the recovery on, both ways
\* (Request::LocalTipFencing), and the catalog fences t's copy until it
\* finalizes the recovered configuration. Recovery term gap 1.
\* Expected: Safety and FinalizedStaysRecovered hold.
SPECIFICATION Spec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, t, a, b, c, r1, r2, r3}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, t, a, b, c}
    Survivors = {s, t}
    Replacements = {r1, r2, r3}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = TRUE
    OnlyWriterRecovers = TRUE
    SurvivorFence = TRUE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 1
    PartitionAfterRecovery = TRUE
    AllowRecovery = TRUE
    AllowCatalogOutage = FALSE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {a, b, t}
    StoppedAtStart = {c}
    LostLeader = a
SYMMETRY ReplacementSymmetry
INVARIANT
    TypeOK
    NoMixedHistory
    CommittedEntriesPreserved
    ElectionSafety
    NewWorldLogMatching
    FinalizedStaysRecovered
