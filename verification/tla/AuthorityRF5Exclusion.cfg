\* RF 5, identity exclusion alone: as AuthorityRF5, but t's lease is not
\* modeled (always valid, never fenced), which only adds behaviors, so the
\* catalog's survivor fence cannot help; t refuses the lost voters both ways
\* from the recovery on. A smaller state space than AuthorityRF5.
\* Expected: Safety and FinalizedStaysRecovered hold.
SPECIFICATION Spec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {s, t, a, b, c, r1, r2, r3}
    ReusedProc = NoProc
    ReusedId = NoProc
    OldVoters = {s, t, a, b, c}
    Survivors = {s, t}
    Replacements = {r1, r2, r3}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = TRUE
    OnlyWriterRecovers = TRUE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 3
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 1
    PartitionAfterRecovery = TRUE
    AllowRecovery = TRUE
    AllowCatalogOutage = FALSE
    AllowReincarnation = FALSE
    RefuseReusedRegistration = TRUE
    AllowStop = FALSE
    LeasedProcs = {a, b}
    StoppedAtStart = {c}
    LostLeader = a
SYMMETRY ReplacementSymmetry
INVARIANT
    TypeOK
    NoMixedHistory
    CommittedEntriesPreserved
    ElectionSafety
    NewWorldLogMatching
    FinalizedStaysRecovered
