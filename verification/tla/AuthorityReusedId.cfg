\* A keeper ID reused on new media: the new incarnation registers with the
\* catalog under a bumped epoch while the first one keeps running (or stops),
\* with the reused-ID refusal of 6d75fec kept as defense in depth.
\* Expected: CommittedEntriesPreserved and ElectionSafety hold.
SPECIFICATION ReuseSpec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {k1, k2, k3, k3n}
    ReusedProc = k3n
    ReusedId = k3
    OldVoters = {k1, k2, k3}
    Survivors = {k1}
    Replacements = {}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 2
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 1
    PartitionAfterRecovery = FALSE
    AllowRecovery = FALSE
    AllowCatalogOutage = FALSE
    AllowReincarnation = TRUE
    RefuseReusedRegistration = TRUE
    AllowStop = TRUE
    LeasedProcs = {k1, k2, k3, k3n}
    StoppedAtStart = {}
    LostLeader = NoProc
INVARIANT
    TypeOK
    CommittedEntriesPreserved
    ElectionSafety
