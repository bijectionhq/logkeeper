\* Control: the epoch bump alone, without 6d75fec. Votes are not gated, so
\* the new incarnation votes with an empty log (or alongside the first
\* incarnation) and a committed record is lost.
\* Expected: CommittedEntriesPreserved is violated.
SPECIFICATION ReuseSpec
CONSTANT
    Nil = Nil
    NoProc = NoProc
    Procs = {k1, k2, k3, k3n}
    ReusedProc = k3n
    ReusedId = k3
    OldVoters = {k1, k2, k3}
    Survivors = {k1}
    Replacements = {}
    L = 2
    M = 1
    D = 1
    WaitOut = TRUE
    FenceRule = "AllOld"
    ExcludeLostIds = FALSE
    OnlyWriterRecovers = FALSE
    SurvivorFence = FALSE
    RecoveryGap = 1
    MaxTerm = 2
    MaxNewTerms = 1
    MaxLogLen = 4
    MaxAppends = 1
    MaxPartitionChanges = 1
    PartitionAfterRecovery = FALSE
    AllowRecovery = FALSE
    AllowCatalogOutage = FALSE
    AllowReincarnation = TRUE
    RefuseReusedRegistration = FALSE
    AllowStop = TRUE
    LeasedProcs = {k1, k2, k3, k3n}
    StoppedAtStart = {}
    LostLeader = NoProc
INVARIANT
    TypeOK
    CommittedEntriesPreserved
    ElectionSafety
