\* RF 5 recovery with two survivors, abstracted to the ranking and the cut:
\* survivors s, t; lost a, b, c (a quorum of the old five, running); three
\* replacements. Commit-first ranking (fc4855ed), identity exclusion of the lost
\* voters, lease wait-out. Expected: every invariant and RecoveryServes hold.
SPECIFICATION Spec
CONSTANTS
    First = s
    Second = t
    Lost = {a, b, c}
    Replacements = {r1, r2, r3}
    ExcludeById = TRUE
    CommitFirst = TRUE
    WaitOut = TRUE
INVARIANTS
    TwoSurvivorsKeepTheirCommits
    LostIdentitiesExcluded
    NoMixedHistory
    ReadRequiresRecoveredQuorum
PROPERTY RecoveryServes
