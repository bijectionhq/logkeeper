\* Control: the second survivor accepts the lost leader's traffic after the
\* probe, learns a commit above the recovery cut, and the recovery drops it.
SPECIFICATION Spec
CONSTANTS
    First = s
    Second = t
    Lost = {a, b, c}
    Replacements = {r1, r2, r3}
    ExcludeById = FALSE
    CommitFirst = TRUE
    WaitOut = TRUE
INVARIANT TwoSurvivorsKeepTheirCommits
