\* Control: rank survivors by tip (term, then length) instead of known commit.
\* A survivor with a longer speculative tail but an older commit index writes
\* the recovery and cuts below the other survivor's known commit.
SPECIFICATION Spec
CONSTANTS
    First = s
    Second = t
    Lost = {a, b, c}
    Replacements = {r1, r2, r3}
    ExcludeById = TRUE
    CommitFirst = FALSE
    WaitOut = TRUE
INVARIANT TwoSurvivorsKeepTheirCommits
