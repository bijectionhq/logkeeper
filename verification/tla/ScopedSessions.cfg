\* An immutable stream and its successor, two principals and two sessions,
\* seal and retry, appends, trims and reservations under fences, lease lapse,
\* renewal and revision change, and a quorum loss recovered under a fresh ID.
\* Expected: every invariant, RequestsSettle and RecoveryStartsSuccessor hold.
SPECIFICATION Spec
CONSTANTS
    Original = original
    Successor = successor
    Owner = owner
    OtherOwner = other
    Session = session
    OtherSession = nextSession
    CheckSession = TRUE
    CheckStream = TRUE
    GateReplies = TRUE
    AllowInPlaceRecovery = FALSE
INVARIANTS
    ImmutablePrefix
    ScopedDecision
    LeaseGatesReply
    ExactSealReceipt
PROPERTIES
    RequestsSettle
    RecoveryStartsSuccessor
