\* Control: recovery cuts the immutable stream in place instead of moving to a
\* fresh stream ID, so committed positions are reused.
SPECIFICATION Spec
CONSTANTS
    Original = original
    Successor = successor
    Owner = owner
    OtherOwner = other
    Session = session
    OtherSession = nextSession
    CheckSession = TRUE
    CheckStream = TRUE
    GateReplies = TRUE
    AllowInPlaceRecovery = TRUE
INVARIANT ImmutablePrefix
