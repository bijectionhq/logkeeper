    Original = original
    Successor = successor
    Owner = owner
    OtherOwner = other
    Session = session
    OtherSession = nextSession
    CheckSession = FALSE
    CheckStream = TRUE
    GateReplies = TRUE
    AllowInPlaceRecovery = FALSE
INVARIANT ScopedDecision
